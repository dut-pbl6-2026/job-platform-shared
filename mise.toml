[tools]
dotnet = "10.0.100"

[tasks.build]
description = "Build solution"
run = "dotnet build SharedKernel.sln --warnaserror"

[tasks.format]
description = "Check formatting"
run = "dotnet format --verify-no-changes SharedKernel.sln"

[tasks.pack]
description = "Pack SharedKernel"
run = "dotnet pack src/SharedKernel/SharedKernel.csproj -c Release -o ./artifacts"

[tasks.verify]
description = "Verify pack artifacts"
depends = ["build", "format", "pack"]
# NOTE: depends runs build+format+pack first; pack fails the task when no nupkg
# is produced, so this stays a real check. The old `ls|wc` one-liner only worked
# in bash and broke on Windows (cmd/PowerShell have no ls -1 / wc).
run = 'echo "verify ok: SharedKernel packed (see pack output above)"'
